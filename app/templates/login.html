<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Paperless Companion</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#17845f">
</head>
<body class="login">
<form method="post" action="/login" class="card login-card">
  <h1>Paperless Companion</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <label class="field"><span>Passwort</span><input type="password" name="password" autofocus required></label>
  <button class="primary">Anmelden</button>
</form>
</body>
</html>
